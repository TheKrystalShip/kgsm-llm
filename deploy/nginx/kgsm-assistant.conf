# kgsm-assistant — public vhost fragment, installed into /etc/nginx/conf.d/ by deploy/setup.sh.
#
# This leaf owns its own vhost and nothing else: the :80 ACME challenge block, the certificate
# lifecycle and nginx.conf itself are HOST-level, because a leaf that claimed them would make every
# other leaf on this box depend on it.
#
# Reaching the assistant on its own hostname is what lets it authenticate people with no Control
# Panel API in front of it — the standalone-leaf property its Discord login was built for.

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name assistant.thekrystalship.com;

    # One certificate covers both hostnames as SANs; the lineage is named for the first one issued.
    ssl_certificate     /etc/letsencrypt/live/kgsm.thekrystalship.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kgsm.thekrystalship.com/privkey.pem;

    client_max_body_size 32m;

    location / {
        proxy_pass         http://127.0.0.1:5180;
        proxy_http_version 1.1;

        # Host travels unchanged. The scheme matters here too: the sign-in handshake cookie is
        # written Secure on any non-development host, but the callback's own redirect handling and
        # anything that reasons about the request's origin should see what the browser actually spoke.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';

        # SSE (/turn, /confirm): the app sends X-Accel-Buffering: no, which nginx honours; stated
        # here so the behaviour does not depend on that header staying in place upstream.
        proxy_buffering    off;
        proxy_cache        off;

        # A blueprint finalize is a MINUTES-long stream of progress frames and heartbeats. The 60s
        # default would cut it mid-run.
        proxy_read_timeout 3600s;
    }
}
