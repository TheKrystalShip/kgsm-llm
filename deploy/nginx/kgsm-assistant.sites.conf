# kgsm-assistant — the site the assistant generates for the names its cluster's DNS anchor gave it.
#
# The service writes /var/lib/kgsm/nginx/kgsm-assistant.conf from a fixed template: a name, its
# certificate, and this component's proxy rules from /etc/nginx/kgsm/kgsm-assistant.locations. A name
# appears there only once its certificate exists. The pattern matches that one file and nothing else,
# and matching nothing is not an error, so the web server loads cleanly before the service has written
# anything.
include /var/lib/kgsm/nginx/kgsm-assistant*.conf;
