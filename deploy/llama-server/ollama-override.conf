# Ollama as the assistant's backend, installed by use-backend.sh ollama into
# /etc/systemd/system/ollama.service.d/override.conf.
#
# OLLAMA_HOST is the one that matters most: Ollama's own default listens wherever it is told, and a routable
# bind is an unauthenticated inference endpoint on the network. The assistant and the indexer reach it on
# loopback. The rest match what the assistant asks of it — the context window it is configured for, one
# request at a time, and a model kept resident once loaded.
[Service]
Environment="OLLAMA_HOST=127.0.0.1"
Environment="OLLAMA_CONTEXT_LENGTH=32768"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_KEEP_ALIVE=-1"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
