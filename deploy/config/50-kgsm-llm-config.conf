# What makes this service's own configuration page take effect.
#
# The service writes a change to the file below and then restarts itself; systemd loads that file
# LAST, after the settings file and every EnvironmentFile= the unit already carries, so an override
# set here wins over what the deploy set. The leading '-' means an absent file is the normal state:
# a host nobody has changed anything on has no override file at all.
#
# This is pure plumbing — static, installed once with a daemon-reload. What changes at runtime is the
# file's CONTENTS, which the service rewrites unprivileged in its own state directory and which needs
# no reload, only the restart that follows a change.
#
# Recovery, if a value here stops this service starting: remove the file and start the unit. That is
# the whole of it, and it is the reason the service logs the path before it bounces itself.
[Service]
EnvironmentFile=-@OVERRIDE_FILE@
